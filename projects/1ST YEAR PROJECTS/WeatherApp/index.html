<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img src="bg.jpg" alt="Background Image" class="Background-image" />
    <div class="heading">
      <h1>Welcome to Weather App</h1>
    </div>
    <div class="search-container">
      <input type="text" placeholder="Enter city name..." id="city-input" />
      <button id="search-btn">Search</button>
    </div>
    <div id="error">
      <p>City not found.</p>
      <p>Please enter a valid city.</p>
    </div>
    <div id="text-content">
      <div class="weather-terms">
        <h2 id="cityName">City: --</h2>
        <div class="temp-container">
          <div style="align-items: center; display: flex; justify-content: center; gap: 10px"><img id="weather-icon" src="" alt=""></div>
          <div id="temp"></div>
          <div id="description"></div>
        </div>
        <div id="horizontal">
            <div id="humidity"> <img src="humidity.png" alt="Humidity"><span id="word">Humidity: </span><span id="humidity-value">--</span></div>
            <div id="Wind-speed"><img src="wind.png" alt="Wind-Speed">Wind Speed: <span id="wind-value">--</span></div>
          </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
