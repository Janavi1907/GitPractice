name: Deploy Websites

on:
  push:
    branches:
      - main
    paths:
      - "projects/1ST YEAR PROJECTS/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare websites
        run: |
          mkdir -p _site
          cp -r "projects/1ST YEAR PROJECTS/PortfolioWebsite/." _site/
          cp -r "projects/1ST YEAR PROJECTS/RockPaperScissors" _site/RockPaperScissors
          cp -r "projects/1ST YEAR PROJECTS/WeatherApp" _site/WeatherApp
          cp -r "projects/1ST YEAR PROJECTS/Student-Marks-Calculator" _site/Student-Marks-Calculator

      - name: Upload websites
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
